<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f63e0"/>
      <stop offset="0.65" stop-color="#6fb4ff"/>
      <stop offset="1" stop-color="#cfe8ff"/>
    </linearGradient>
    <linearGradient id="rock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a6544"/>
      <stop offset="0.45" stop-color="#6d655c"/>
      <stop offset="1" stop-color="#3f3a37"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ee05a"/>
      <stop offset="1" stop-color="#4c8f28"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#c9d3de"/>
      <stop offset="1" stop-color="#7d8a99"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <!-- sea of clouds -->
  <g fill="#ffffff">
    <circle cx="40" cy="468" r="58"/><circle cx="140" cy="492" r="66"/><circle cx="262" cy="480" r="72"/>
    <circle cx="384" cy="494" r="64"/><circle cx="486" cy="466" r="60"/><rect x="0" y="480" width="512" height="40"/>
  </g>
  <g fill="#ffffff" opacity="0.7"><circle cx="96" cy="150" r="22"/><circle cx="124" cy="140" r="28"/><circle cx="154" cy="152" r="20"/></g>
  <!-- floating island -->
  <path d="M112 312 Q256 284 400 312 L372 342 L330 356 L310 404 L284 370 L258 452 L232 372 L204 404 L184 354 L142 340 Z" fill="url(#rock)"/>
  <ellipse cx="256" cy="312" rx="146" ry="32" fill="url(#grass)"/>
  <ellipse cx="236" cy="306" rx="92" ry="14" fill="#b4ec74" opacity="0.45"/>
  <!-- trees -->
  <rect x="173" y="282" width="7" height="20" fill="#5b3e27"/>
  <path d="M158 288 L176 236 L194 288 Z" fill="#2f6b2a"/>
  <path d="M163 268 L176 226 L189 268 Z" fill="#3c8034"/>
  <rect x="318" y="276" width="8" height="24" fill="#5b3e27"/>
  <circle cx="322" cy="262" r="24" fill="#5aa83a"/>
  <circle cx="312" cy="254" r="12" fill="#7cc451"/>
  <!-- rope -->
  <path d="M470 34 Q 420 120 300 196" stroke="#2a2118" stroke-width="9" fill="none" stroke-linecap="round"/>
  <path d="M470 34 Q 420 120 300 196" stroke="#8a6a44" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="6 8"/>
  <!-- grappling hook head, pointing down toward the island -->
  <g transform="translate(292 206) rotate(32)">
    <rect x="-9" y="-34" width="18" height="40" rx="5" fill="url(#steel)" stroke="#4a5562" stroke-width="3"/>
    <circle cx="0" cy="-38" r="9" fill="none" stroke="#4a5562" stroke-width="5"/>
    <path d="M0 4 C -40 14 -52 -14 -36 -40" fill="none" stroke="#4a5562" stroke-width="15" stroke-linecap="round"/>
    <path d="M0 4 C 40 14 52 -14 36 -40" fill="none" stroke="#4a5562" stroke-width="15" stroke-linecap="round"/>
    <path d="M0 4 C -40 14 -52 -14 -36 -40" fill="none" stroke="url(#steel)" stroke-width="9" stroke-linecap="round"/>
    <path d="M0 4 C 40 14 52 -14 36 -40" fill="none" stroke="url(#steel)" stroke-width="9" stroke-linecap="round"/>
    <path d="M-12 2 L0 40 L12 2 Z" fill="url(#steel)" stroke="#4a5562" stroke-width="3" stroke-linejoin="round"/>
  </g>
</svg>
